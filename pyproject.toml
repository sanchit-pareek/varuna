[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidetrace"
version = "1.0.0"
description = "Offline SAR oil slick detection, drift hindcast and forecast, and AIS vessel attribution. SIH26143, NTRO, Space Technology."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
recommended = ["scipy>=1.11", "pyproj>=3.6", "rasterio>=1.3", "shapely>=2.0", "pillow>=10.0", "requests>=2.31"]
train = ["torch>=2.1", "segmentation-models-pytorch>=0.3.3", "albumentations>=1.4", "scikit-learn>=1.4"]
sync = ["huggingface_hub>=1.29", "kaggle>=2.2"]
report = ["reportlab>=4.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.api", "app.ml", "app.geo", "app.drift", "app.ais", "app.viz", "app.jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F and E9 catch real defects; B catches the bug-shaped patterns worth arguing
# about. Style beyond that is not worth a CI failure on a project this size.
select = ["F", "E9", "B"]
ignore = [
  "B008",  # FastAPI's Depends/File/Form idiom is a function call in a default
  "B905",  # zip strict= would be noise on same-length coordinate arrays
]
