<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" width="1160" height="580"
     role="img" aria-label="Every network call happens in the preparation lane before the demo and writes into data slash. The judged demo lane reads only those files and never opens a socket.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa6bf"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#35d0ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="580" fill="#0c141f"/>

  <text x="24" y="34" fill="#ffffff" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="700">TideTrace: the offline boundary</text>
  <text x="24" y="56" fill="#8fa6bf" font-family="ui-monospace,Consolas,monospace" font-size="13">Network access exists only to the left of the wall. The judged demo reads files.</text>

  <!-- lane labels -->
  <rect x="24" y="78" width="676" height="26" fill="#16273a" stroke="#1e2f45"/>
  <text x="36" y="96" fill="#ffd60a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">PREPARATION LANE  ·  online  ·  runs once, before judging</text>

  <rect x="756" y="78" width="380" height="26" fill="#06201a" stroke="#1e2f45"/>
  <text x="768" y="96" fill="#2ee6a8" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">JUDGED DEMO  ·  airplane mode</text>

  <!-- A: remote sources -->
  <text x="24" y="132" fill="#61798f" font-family="ui-monospace,Consolas,monospace" font-size="12">REMOTE SOURCES</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#d8e6f5">
    <rect x="24" y="144" width="212" height="40" fill="#111c2a" stroke="#2c4a6b"/>
    <text x="36" y="162">Planetary Computer</text><text x="36" y="177" fill="#8fa6bf" font-size="11">Sentinel-1 RTC, windowed read</text>

    <rect x="24" y="192" width="212" height="40" fill="#111c2a" stroke="#2c4a6b"/>
    <text x="36" y="210">Zenodo</text><text x="36" y="225" fill="#8fa6bf" font-size="11">SAR training set, 10 to 40 GB</text>

    <rect x="24" y="240" width="212" height="40" fill="#111c2a" stroke="#2c4a6b"/>
    <text x="36" y="258">Open-Meteo</text><text x="36" y="273" fill="#8fa6bf" font-size="11">ERA5 wind, marine currents</text>

    <rect x="24" y="288" width="212" height="40" fill="#111c2a" stroke="#2c4a6b"/>
    <text x="36" y="306">MarineCadastre</text><text x="36" y="321" fill="#8fa6bf" font-size="11">real AIS, 340 MB per day</text>

    <rect x="24" y="336" width="212" height="40" fill="#111c2a" stroke="#2c4a6b"/>
    <text x="36" y="354">Natural Earth</text><text x="36" y="369" fill="#8fa6bf" font-size="11">coastline polygons</text>

    <rect x="24" y="396" width="212" height="52" fill="#1d1608" stroke="#ffb020"/>
    <text x="36" y="414" fill="#ffdba3">Hugging Face</text>
    <text x="36" y="429" fill="#c9a86a" font-size="11">tiles dataset + checkpoints</text>
    <text x="36" y="443" fill="#c9a86a" font-size="11">keeps the corpus off the laptop</text>
  </g>

  <!-- B: scripts -->
  <text x="292" y="132" fill="#61798f" font-family="ui-monospace,Consolas,monospace" font-size="12">scripts/  ·  the only code that dials out</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#d8e6f5">
    <rect x="292" y="144" width="200" height="304" fill="#111c2a" stroke="#2c4a6b"/>
    <text x="304" y="166">fetch_sentinel1_scene.py</text>
    <text x="304" y="188">download_zenodo_subset.py</text>
    <text x="304" y="210">build_metocean_cache.py</text>
    <text x="304" y="232">fetch_marinecadastre_ais.py</text>
    <text x="304" y="254">build_synthetic_ais.py</text>
    <text x="304" y="276">build_land_mask.py</text>
    <text x="304" y="298">prepare_tiles.py</text>
    <text x="304" y="320">hf_sync.py</text>
    <text x="304" y="342">kaggle_push.py</text>
    <text x="304" y="364">fetch_vendor.py</text>
    <line x1="304" y1="380" x2="480" y2="380" stroke="#2c4a6b"/>
    <text x="304" y="400" fill="#8fa6bf" font-size="11">bootstrap_demo.py runs the</text>
    <text x="304" y="415" fill="#8fa6bf" font-size="11">whole lane in one command</text>
    <text x="304" y="436" fill="#61798f" font-size="11">then prints a readiness table</text>
  </g>

  <!-- C: frozen files -->
  <text x="548" y="132" fill="#61798f" font-family="ui-monospace,Consolas,monospace" font-size="12">FROZEN ON DISK</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#d8e6f5">
    <rect x="548" y="144" width="152" height="34" fill="#0b1725" stroke="#35d0ff"/>
    <text x="558" y="166">data/sar/</text>

    <rect x="548" y="186" width="152" height="34" fill="#0b1725" stroke="#35d0ff"/>
    <text x="558" y="208">data/metocean/</text>

    <rect x="548" y="228" width="152" height="34" fill="#0b1725" stroke="#35d0ff"/>
    <text x="558" y="250">data/ais/*.sqlite</text>

    <rect x="548" y="270" width="152" height="34" fill="#0b1725" stroke="#35d0ff"/>
    <text x="558" y="292">data/land/</text>

    <rect x="548" y="312" width="152" height="34" fill="#0b1725" stroke="#35d0ff"/>
    <text x="558" y="334">models/*.pt</text>

    <rect x="548" y="354" width="152" height="34" fill="#0b1725" stroke="#35d0ff"/>
    <text x="558" y="376">static/vendor/</text>
  </g>

  <!-- arrows A -> B -->
  <g stroke="#8fa6bf" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="240" y1="164" x2="286" y2="164"/>
    <line x1="240" y1="212" x2="286" y2="212"/>
    <line x1="240" y1="260" x2="286" y2="260"/>
    <line x1="240" y1="308" x2="286" y2="308"/>
    <line x1="240" y1="356" x2="286" y2="356"/>
  </g>
  <g stroke="#ffb020" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="240" y1="422" x2="286" y2="422"/>
  </g>

  <!-- arrows B -> C -->
  <g stroke="#35d0ff" stroke-width="1.6" fill="none" marker-end="url(#aw)">
    <line x1="496" y1="252" x2="542" y2="200"/>
    <line x1="496" y1="268" x2="542" y2="290"/>
  </g>
  <text x="500" y="232" fill="#35d0ff" font-family="ui-monospace,Consolas,monospace" font-size="11">writes</text>

  <!-- the wall -->
  <line x1="728" y1="112" x2="728" y2="476" stroke="#2ee6a8" stroke-width="2.5" stroke-dasharray="9,6"/>
  <text x="666" y="216" fill="#2ee6a8" font-family="ui-monospace,Consolas,monospace" font-size="11">reads</text>
  <text x="736" y="132" fill="#2ee6a8" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700">NO SOCKET</text>
  <text x="736" y="148" fill="#2ee6a8" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700">CROSSES HERE</text>

  <!-- D: runtime -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#d8e6f5">
    <rect x="756" y="186" width="380" height="76" fill="#111c2a" stroke="#2c4a6b"/>
    <text x="770" y="208" fill="#ffffff" font-size="13" font-weight="700">app/  ·  FastAPI</text>
    <text x="770" y="228" fill="#8fa6bf" font-size="11.5">reads the files above, computes everything else</text>
    <text x="770" y="247" fill="#8fa6bf" font-size="11.5">detect, characterise, hindcast, forecast, join, score</text>

    <rect x="756" y="282" width="380" height="60" fill="#111c2a" stroke="#2c4a6b"/>
    <text x="770" y="304" fill="#ffffff" font-size="13" font-weight="700">static/  ·  Leaflet console</text>
    <text x="770" y="324" fill="#8fa6bf" font-size="11.5">map, layers, time slider, leaderboard, trace</text>

    <rect x="756" y="362" width="380" height="88" fill="#06201a" stroke="#2ee6a8"/>
    <text x="770" y="384" fill="#2ee6a8" font-size="12" font-weight="700">enforced, not promised</text>
    <text x="770" y="404" fill="#a9f4dc" font-size="11.5">test_pipeline_offline blocks every socket and DNS</text>
    <text x="770" y="421" fill="#a9f4dc" font-size="11.5">lookup, then drives POST /api/run to completion</text>
    <text x="770" y="438" fill="#a9f4dc" font-size="11.5">test_offline_boundary bans network imports in app/</text>
  </g>

  <!-- arrow C -> D across the wall -->
  <g stroke="#2ee6a8" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="706" y1="224" x2="750" y2="224"/>
  </g>


  <text x="24" y="512" fill="#61798f" font-family="ui-monospace,Consolas,monospace" font-size="12">Once the preparation lane has run, unplug the network. Every number the console shows is computed from the frozen files.</text>
  <text x="24" y="534" fill="#61798f" font-family="ui-monospace,Consolas,monospace" font-size="12">Hugging Face carries the training corpus and the checkpoints so the demo laptop only ever holds one file under 80 MB.</text>
  <text x="24" y="556" fill="#61798f" font-family="ui-monospace,Consolas,monospace" font-size="12">SIH26143  ·  NTRO  ·  Space Technology</text>
</svg>
